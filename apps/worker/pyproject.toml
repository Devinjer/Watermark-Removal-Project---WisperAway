[project]
name = "wisperaway-worker"
version = "0.1.0"
description = "WisperAway AI processing worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["wisperaway_worker"]
mypy_path = "src"
